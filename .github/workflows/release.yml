name: Release & Docker Build

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build, Tag, Release & Publish Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go (1.24.x)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Frontend Dependencies & Build UI
        run: |
          cd web
          npm ci || npm install
          npm run build
          cd ..

      - name: Run Backend Tests
        run: |
          go test -v ./...

      - name: Determine Version & Create Git Tag
        id: tag_version
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION} for commit ${{ github.sha }}"
          git push origin "${VERSION}"

      - name: Cross-Compile Standalone Binaries
        run: |
          mkdir -p release-artifacts
          TARGETS=(
            "linux/amd64/taskmaster-linux-amd64"
            "linux/arm64/taskmaster-linux-arm64"
            "darwin/amd64/taskmaster-darwin-amd64"
            "darwin/arm64/taskmaster-darwin-arm64"
            "windows/amd64/taskmaster-windows-amd64.exe"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS="/" read -r OS ARCH BIN <<< "$TARGET"
            echo "Compiling for ${OS}/${ARCH} -> ${BIN}..."
            CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build -ldflags="-s -w" -o "release-artifacts/${BIN}" ./cmd/taskmaster
          done

          cd release-artifacts
          tar -czvf "taskmaster-${{ env.VERSION }}-linux-amd64.tar.gz" taskmaster-linux-amd64
          tar -czvf "taskmaster-${{ env.VERSION }}-linux-arm64.tar.gz" taskmaster-linux-arm64
          tar -czvf "taskmaster-${{ env.VERSION }}-darwin-amd64.tar.gz" taskmaster-darwin-amd64
          tar -czvf "taskmaster-${{ env.VERSION }}-darwin-arm64.tar.gz" taskmaster-darwin-arm64
          zip "taskmaster-${{ env.VERSION }}-windows-amd64.zip" taskmaster-windows-amd64.exe
          sha256sum *.tar.gz *.zip > sha256sums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.tag }}
          name: "TaskMaster ${{ steps.tag_version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha,format=short

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
