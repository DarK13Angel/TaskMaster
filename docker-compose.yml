services:
  taskmaster:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskmaster:latest
    container_name: taskmaster
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - TASK_TTL_DAYS=30
      - CLEANUP_INTERVAL_HOURS=6
      - TASKMASTER_DATA_DIR=/data
    volumes:
      - taskmaster-data:/data

volumes:
  taskmaster-data:
    driver: local
